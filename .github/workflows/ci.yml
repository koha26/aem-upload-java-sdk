name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Install root module (skip tests)
        run: mvn -B -DskipTests install

      - name: Verify root module
        run: mvn -B verify

      - name: Verify OSGi bundle module
        working-directory: osgi/bundle
        run: mvn -B verify

      - name: Verify Spring Boot starter module
        working-directory: spring-boot-starter
        run: mvn -B verify
